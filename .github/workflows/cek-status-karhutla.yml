name: Cek Status Karhutla (Terjadwal)

on:
  schedule:
    # Jalan tiap 1 jam (UTC). Sesuaikan kalau mau lebih sering/jarang.
    - cron: "0 * * * *"
  workflow_dispatch: {} # supaya bisa di-trigger manual dari tab Actions untuk testing

permissions:
  contents: write # perlu izin nulis supaya bisa commit balik status terbaru ke repo

jobs:
  cek-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Jalankan pengecekan status karhutla
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/cek-status-karhutla.mjs

      - name: Commit status terbaru balik ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status-notifikasi-terakhir.json
          git diff --quiet --cached || git commit -m "Update status notifikasi karhutla [otomatis]"
          git push
